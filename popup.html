<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leftdays</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="title">Days left in this year</div>
      </header>

      <main>
        <div id="headline" class="headline"></div>
        <div id="yearGrid" class="year-grid" aria-label="Year grid"></div>
        <div class="notes-section">
          <div id="notesReadView" class="notes-read-view" tabindex="0" title="Press 'i' to edit"></div>
          <textarea id="notesEditView" class="notes-editor" style="display:none" spellcheck="false" placeholder="Type here... (- item, -- sub-item)"></textarea>
        </div>
      </main>
    </div>

    <script src="popup.js"></script>
    <script src="notes.js"></script>
  </body>
</html>
